[project]
name = "yamlreel"
version = "0.2.0"
description = "Spec-driven generator for short project, system-design and demo videos (YouTube, Shorts, LinkedIn)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nitin Sijwali"}]
keywords = [
  "text-to-video", "video-generation", "youtube-shorts", "explainer-video", "system-design",
  "yaml", "ffmpeg", "voiceover", "tts", "manim-alternative",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics :: Presentation",
]
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/nsijwali/yamlreel"
Repository = "https://github.com/nsijwali/yamlreel"
Issues = "https://github.com/nsijwali/yamlreel/issues"
Changelog = "https://github.com/nsijwali/yamlreel/releases"

[project.optional-dependencies]
capture = ["playwright>=1.40"]
ffmpeg = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=7"]

[project.scripts]
yamlreel = "yamlreel.cli:main"
vidgen = "yamlreel.legacy:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["yamlreel*"]

[tool.setuptools.package-data]
yamlreel = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
