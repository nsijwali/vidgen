[project]
name = "vidgen"
version = "0.1.0"
description = "Spec-driven generator for short project, system-design and demo videos (YouTube, Shorts, LinkedIn)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
capture = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
vidgen = "vidgen.cli:main"

[tool.setuptools.packages.find]
include = ["vidgen*"]

[tool.setuptools.package-data]
vidgen = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
