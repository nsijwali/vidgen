# A ~18s system-design explainer (works as a YouTube Short or LinkedIn clip).
# One idea only: hook, a diagram that shows the mechanism, the fix, a takeaway.
meta:
  title: "Cache stampede in 18 seconds"
  description: "Why one expired cache key can take down your database, and three ways to stop it."
  tags: [systemdesign, caching, backend, softwareengineering]
  links: []
theme: midnight          # sumi | washi | midnight
# watermark: "Your Name"    # text, or {image: logo.png, position: top-left, opacity: 0.75}; or set it once in yamlreel.config.yaml
formats: [vertical, landscape]
music: {style: koto, bpm: 72, seed: 7, snap: false}
scenes:
  - type: type
    text: "What is a cache stampede?"
    seconds: 3

  - type: diagram
    seconds: 7.5
    title: "One hot key"
    caption: "It expires. Every request misses."
    nodes:      # x,y are 0..1 of the frame; vx,vy override them in vertical
      - {id: users, label: "10,000 users", kind: client, x: 0.13, y: 0.46, vx: 0.4, vy: 0.2}
      - {id: cache, label: "Cache", kind: cache, x: 0.50, y: 0.46, vx: 0.4, vy: 0.40}
      - {id: db, label: "Database", kind: db, x: 0.87, y: 0.46, vx: 0.4, vy: 0.60}
    edges:
      - {from: users, to: cache, label: "GET /product/42"}
      - {from: cache, to: db, label: "miss", bad: true, at: 3.4}
    flash:
      - {node: cache, at: 3.0, text: "key expired"}
      - {node: db, at: 5.2, text: "overloaded"}

  - type: bullets
    seconds: 5
    title: "The fix"
    items:
      - "Let one request rebuild the key"
      - "Serve stale while it refreshes"
      - "Add jitter to every TTL"

  - type: title
    seconds: 3
    eyebrow: "System design in 20 seconds"
    title: "Cache stampede"
    subtitle: "One expiry, ten thousand queries."
