name: Feature request
description: Suggest a scene type, option, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: Describe the video or workflow you could not build today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like yamlreel to do?
      description: If it changes the spec format, a small YAML example helps.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to send a pull request for this.
