# A 43s explainer (vertical + landscape). Render: vidgen render examples/cache-stampede-45s.yaml --out out
meta:
  title: Cache stampede explained in 45 seconds
  description: Why one expired cache key can take down your database, and how to stop
    it.
  tags:
  - systemdesign
  - caching
  - backend
  links: []
theme: midnight
formats:
- vertical
- landscape
music:
  style: koto
  bpm: 72
  seed: 7
  snap: false
scenes:
- type: type
  text: What is a cache stampede?
  seconds: 3
- type: diagram
  seconds: 7.5
  title: One hot key
  caption: It expires. Every request misses.
  nodes:
  - id: users
    label: 10,000 users
    kind: client
    x: 0.13
    y: 0.46
    vx: 0.4
    vy: 0.2
  - id: cache
    label: Cache
    kind: cache
    x: 0.5
    y: 0.46
    vx: 0.4
    vy: 0.4
  - id: db
    label: Database
    kind: db
    x: 0.87
    y: 0.46
    vx: 0.4
    vy: 0.6
  edges:
  - from: users
    to: cache
    label: GET /product/42
  - from: cache
    to: db
    label: miss
    bad: true
    at: 3.4
  flash:
  - node: cache
    at: 3.0
    text: key expired
  - node: db
    at: 5.2
    text: overloaded
- type: bullets
  seconds: 5
  title: The fix
  items:
  - Let one request rebuild the key
  - Serve stale while it refreshes
  - Add jitter to every TTL
- type: bullets
  title: Why it happens
  seconds: 8
  items:
  - A popular key shares one expiry time
  - Everyone misses at the same moment
  - All misses hit the database together
- type: code
  title: lock.py
  seconds: 12
  code: "def get(key):\n    value = cache.get(key)\n    if value is None:\n      \
    \  with lock(key):\n            value = cache.get(key) or rebuild(key)\n    return\
    \ value"
  highlight:
  - 4
  caption: One request rebuilds. The rest wait.
- type: stat
  value: "10,000 \u2192 1"
  label: database queries per expiry
  seconds: 5
- type: title
  seconds: 3
  eyebrow: System design in 20 seconds
  title: Cache stampede
  subtitle: One expiry, ten thousand queries.
