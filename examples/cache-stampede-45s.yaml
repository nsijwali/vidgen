# A ~45s narrated explainer (vertical + landscape).
# Render: vidgen render examples/cache-stampede-45s.yaml --out out --voice-url http://127.0.0.1:3900/mcp/
# Every scene but the end card has its own `narration:`, so the voice explains the idea instead of reading
# the screen. Narration needs a TTS server: pass --voice-url or set voice_server.url in your user config
# (vidgen config init --user). Without one, render stops with an error. The end card's `narration: false`
# keeps it silent even with --read-screen.
meta:
  title: Cache stampede explained in 45 seconds
  description: Why one expired cache key can take down your database, and how to stop
    it.
  tags:
  - systemdesign
  - caching
  - backend
  links: []
theme: midnight
formats:
- vertical
- landscape
music:
  style: koto
  bpm: 72
  seed: 7
  snap: false
scenes:
- type: type
  text: What is a cache stampede?
  seconds: 3
  narration: Ever seen one expired cache key take down a whole database? That's a cache stampede.
- type: diagram
  seconds: 7.5
  title: One hot key
  caption: It expires. Every request misses.
  narration: Ten thousand users hit the same cached page. Then the key expires, and every one of them
    goes straight to the database.
  nodes:
  - id: users
    label: 10,000 users
    kind: client
    x: 0.13
    y: 0.46
    vx: 0.4
    vy: 0.2
  - id: cache
    label: Cache
    kind: cache
    x: 0.5
    y: 0.46
    vx: 0.4
    vy: 0.4
  - id: db
    label: Database
    kind: db
    x: 0.87
    y: 0.46
    vx: 0.4
    vy: 0.6
  edges:
  - from: users
    to: cache
    label: GET /product/42
  - from: cache
    to: db
    label: miss
    bad: true
    at: 3.4
  flash:
  - node: cache
    at: 3.0
    text: key expired
  - node: db
    at: 5.2
    text: overloaded
- type: bullets
  title: Why it happens
  seconds: 8
  narration: It happens because a popular key has a single expiry time, so every client misses in the
    same instant.
  items:
  - A popular key shares one expiry time
  - Everyone misses at the same moment
  - All misses hit the database together
- type: bullets
  seconds: 5
  title: The fix
  narration: Three fixes. Let one request rebuild the key, serve the old value while it refreshes, and add
    a little randomness to every expiry.
  items:
  - Let one request rebuild the key
  - Serve stale while it refreshes
  - Add jitter to every TTL
- type: code
  title: lock.py
  seconds: 9
  code: "def get(key):\n    value = cache.get(key)\n    if value is None:\n      \
    \  with lock(key):\n            value = cache.get(key) or rebuild(key)\n    return\
    \ value"
  highlight:
  - 4
  caption: One request rebuilds. The rest wait.
  narration: Here's the first fix in code. The first request takes a lock and rebuilds the value, and the
    rest wait a moment, then read it from the cache.
- type: stat
  value: "10,000 → 1"
  label: database queries per expiry
  seconds: 5
  narration: Ten thousand queries become one.
- type: title
  seconds: 3
  eyebrow: System design in under a minute
  title: Cache stampede
  subtitle: One expiry, ten thousand queries.
  narration: false
