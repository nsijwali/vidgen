# A ~1-minute video about vidgen, made with vidgen (vertical + landscape).
# Render: vidgen render examples/vidgen-intro.yaml --voice-url http://127.0.0.1:3900/mcp/
# Narration needs a TTS server; add --no-voice for a music-only cut (and drop the "Voice:" credit below).
meta:
  title: Nobody edited this video
  description: This video was rendered from one YAML file with vidgen. Diagrams, music and my own cloned voice,
    all made on my laptop. It's free and open source, so you can make one too.
  tags: [opensource, python, devtools, buildinpublic]
  links: ["https://github.com/nsijwali/vidgen"]
  credits: ["Voice: cloned with VoiceStudio (OmniVoice model, CC-BY-NC)", "Music: generated by vidgen"]
theme: midnight
formats: [vertical, landscape]
music: {style: koto, bpm: 76, seed: 11}
scenes:
- type: type
  text: Plot twist. Nobody edited this video.
  seconds: 3
  narration: Quick confession. Nobody edited this video. It was rendered from one file.

- type: code
  title: vidgen-intro.yaml
  seconds: 7
  code: "scenes:\n  - type: type\n    text: Plot twist. Nobody edited this video.\n    narration: Quick confession.\
    \ Nobody edited this video.\n  - type: diagram\n    title: What just happened"
  highlight: [3]
  caption: A shopping list for a video.
  narration: I wrote one YAML file, kind of a shopping list for a video, and vidgen did the rest.

- type: diagram
  seconds: 8
  title: What just happened
  narration: vidgen drew every frame and made up the music. VoiceStudio lent it my voice, right on my laptop.
    And ffmpeg wrapped it into the video you're watching.
  nodes:
  - {id: spec, label: YAML spec, kind: client, x: 0.1, y: 0.36, vx: 0.72, vy: 0.21}
  - {id: voice, label: VoiceStudio, kind: service, x: 0.1, y: 0.62, vx: 0.28, vy: 0.29}
  - {id: vidgen, label: vidgen, kind: service, x: 0.36, y: 0.49, vx: 0.5, vy: 0.45}
  - {id: ffmpeg, label: ffmpeg, kind: service, x: 0.66, y: 0.49, vx: 0.5, vy: 0.63}
  - {id: mp4, label: this video, kind: db, x: 0.88, y: 0.49, vx: 0.5, vy: 0.8}
  edges:
  - {from: spec, to: vidgen, label: scenes}
  - {from: voice, to: vidgen, label: my voice, at: 1.5}
  - {from: vidgen, to: ffmpeg, label: frames + audio, at: 3.0}
  - {from: ffmpeg, to: mp4, label: H.264, at: 4.5}
  flash:
  - {node: voice, at: 1.5, text: local}
  - {node: mp4, at: 5.5, text: you are here}

- type: stat
  value: "0"
  label: video editors were opened to make this
  seconds: 4
  narration: Video editors opened? Zero.

- type: shot
  source: assets/formats.jpg
  seconds: 6
  fit: card
  zoom: [1.0, 1.06]
  focus: [0.5, 0.5]
  caption: Same file, every format.
  narration: And you get a YouTube version, a Shorts version and a thumbnail, from the same file.

- type: code
  title: your turn
  seconds: 7
  code: "# install: see the README\nvidgen init system-design my.yaml\nvidgen render my.yaml"
  highlight: [3]
  caption: Install steps are in the README.
  narration: Your turn. Follow the quick start in the README, then it's two commands. Your first video is a
    few minutes away.

- type: bullets
  title: Thanks to the crew
  seconds: 6
  items:
  - VoiceStudio + OmniVoice for my voice
  - Pillow and NumPy for the pixels, ffmpeg for encoding
  - Claude Code for building it with me
  narration: Shout-out to the crew. VoiceStudio for the voice, Pillow and ffmpeg for the visuals, and Claude
    Code, which helped me build the whole thing.

- type: title
  seconds: 4
  eyebrow: Free and open source
  title: vidgen
  subtitle: Write YAML. Get a video.
  url: github.com/nsijwali/vidgen
  narration: It's free and open source. Go make something, and tag me when you do.
